<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#578c5a"/>
      <stop offset="33%" style="stop-color:#553b6e"/>
      <stop offset="66%" style="stop-color:#c14649"/>
      <stop offset="100%" style="stop-color:#ecd490"/>
    </linearGradient>
  </defs>

  <!-- Outer circle (phi shape) -->
  <circle cx="50" cy="50" r="36" fill="none" stroke="url(#logoGrad)" stroke-width="6"/>

  <!-- Compass needle pointing up (North) - cool colors -->
  <polygon points="50,50 50,0 44,50" fill="#578c5a"/>
  <polygon points="50,50 50,0 56,50" fill="#553b6e"/>

  <!-- Compass needle pointing down (South) - warm colors -->
  <polygon points="50,50 50,100 44,50" fill="#ecd490"/>
  <polygon points="50,50 50,100 56,50" fill="#c14649"/>

  <!-- Center circle -->
  <circle cx="50" cy="50" r="8" fill="url(#logoGrad)"/>
  <circle cx="50" cy="50" r="4" fill="#f7f1e8"/>
</svg>
