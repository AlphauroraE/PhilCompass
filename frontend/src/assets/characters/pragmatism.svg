<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Pragmatism - The Practical Idealist: hands building/creating -->
  <defs>
    <linearGradient id="pragGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ecd490"/>
      <stop offset="100%" style="stop-color:#d4bc70"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#pragGrad)" opacity="0.2"/>

  <!-- Figure silhouette -->
  <ellipse cx="100" cy="55" rx="25" ry="28" fill="#ecd490"/>

  <!-- Body -->
  <path d="M60 85 Q100 75 140 85 L150 140 Q100 150 50 140 Z" fill="#ecd490"/>

  <!-- Arms reaching out building -->
  <path d="M55 95 L30 110 L35 115 L60 100" fill="#d4bc70"/>
  <path d="M145 95 L170 110 L165 115 L140 100" fill="#d4bc70"/>

  <!-- Building blocks being constructed -->
  <rect x="75" y="130" width="20" height="15" fill="#c9a855" rx="2"/>
  <rect x="100" y="130" width="20" height="15" fill="#c9a855" rx="2"/>
  <rect x="87" y="118" width="20" height="15" fill="#d4bc70" rx="2"/>

  <!-- Gear symbol (practical) -->
  <circle cx="100" cy="170" r="15" fill="none" stroke="#c9a855" stroke-width="3"/>
  <circle cx="100" cy="170" r="6" fill="#c9a855"/>
  <g stroke="#c9a855" stroke-width="3">
    <line x1="100" y1="152" x2="100" y2="158"/>
    <line x1="100" y1="182" x2="100" y2="188"/>
    <line x1="82" y1="170" x2="88" y2="170"/>
    <line x1="112" y1="170" x2="118" y2="170"/>
  </g>
</svg>
