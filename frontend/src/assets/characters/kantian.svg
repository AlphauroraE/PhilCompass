<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Kantian - The Duty Defender: stern figure with scales and moral law tablet -->
  <defs>
    <linearGradient id="kantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#553b6e"/>
      <stop offset="100%" style="stop-color:#3d2a4f"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#kantGrad)" opacity="0.2"/>

  <!-- Starry sky above (moral law) -->
  <g fill="#553b6e" opacity="0.6">
    <circle cx="50" cy="25" r="2"/>
    <circle cx="80" cy="18" r="1.5"/>
    <circle cx="100" cy="22" r="2"/>
    <circle cx="125" cy="15" r="1.5"/>
    <circle cx="150" cy="25" r="2"/>
    <circle cx="65" cy="35" r="1"/>
    <circle cx="135" cy="32" r="1"/>
  </g>

  <!-- Figure head - stern/principled -->
  <ellipse cx="100" cy="65" rx="25" ry="27" fill="#553b6e"/>

  <!-- Stern expression -->
  <line x1="88" y1="60" x2="96" y2="62" stroke="#3d2a4f" stroke-width="2"/>
  <line x1="104" y1="62" x2="112" y2="60" stroke="#3d2a4f" stroke-width="2"/>
  <line x1="92" y1="72" x2="108" y2="72" stroke="#3d2a4f" stroke-width="2"/>

  <!-- Body upright and formal -->
  <path d="M70 95 Q100 85 130 95 L128 160 Q100 170 72 160 Z" fill="#553b6e"/>

  <!-- Arms holding tablet -->
  <path d="M72 105 L55 115 L55 145 L72 140" fill="#3d2a4f"/>
  <path d="M128 105 L145 115 L145 145 L128 140" fill="#3d2a4f"/>

  <!-- Moral law tablet -->
  <rect x="60" y="110" width="80" height="50" fill="#3d2a4f" rx="3"/>
  <text x="100" y="135" font-family="serif" font-size="12" fill="#553b6e" text-anchor="middle">DUTY</text>
  <line x1="70" y1="145" x2="130" y2="145" stroke="#553b6e" stroke-width="1"/>
  <line x1="75" y1="152" x2="125" y2="152" stroke="#553b6e" stroke-width="1"/>

  <!-- Categorical imperative symbol (universal) -->
  <circle cx="100" cy="180" r="12" fill="none" stroke="#3d2a4f" stroke-width="2"/>
  <text x="100" y="185" font-family="serif" font-size="14" fill="#3d2a4f" text-anchor="middle">∀</text>
</svg>
