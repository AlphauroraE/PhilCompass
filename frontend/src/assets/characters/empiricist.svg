<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Empiricism - The Evidence Seeker: figure with magnifying glass and observation tools -->
  <defs>
    <linearGradient id="empGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#578c5a"/>
      <stop offset="100%" style="stop-color:#3d6940"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#empGrad)" opacity="0.2"/>

  <!-- Figure head -->
  <ellipse cx="90" cy="70" rx="24" ry="26" fill="#578c5a"/>

  <!-- Body leaning forward (investigating) -->
  <path d="M60 98 Q90 88 120 98 L118 155 Q90 165 62 155 Z" fill="#578c5a"/>

  <!-- Arm holding magnifying glass -->
  <path d="M115 105 L145 85" stroke="#3d6940" stroke-width="8" stroke-linecap="round"/>

  <!-- Magnifying glass -->
  <circle cx="155" cy="75" r="22" fill="none" stroke="#3d6940" stroke-width="4"/>
  <circle cx="155" cy="75" r="18" fill="#578c5a" opacity="0.3"/>
  <line x1="140" y1="90" x2="125" y2="105" stroke="#3d6940" stroke-width="4" stroke-linecap="round"/>

  <!-- What's being observed (data points) -->
  <circle cx="155" cy="70" r="3" fill="#3d6940"/>
  <circle cx="160" cy="78" r="2" fill="#3d6940"/>
  <circle cx="150" cy="80" r="2.5" fill="#3d6940"/>

  <!-- Other arm taking notes -->
  <path d="M62 105 L40 120" stroke="#3d6940" stroke-width="6" stroke-linecap="round"/>

  <!-- Notebook -->
  <rect x="25" y="115" width="25" height="32" fill="#3d6940" rx="2"/>
  <line x1="30" y1="125" x2="45" y2="125" stroke="#578c5a" stroke-width="1.5"/>
  <line x1="30" y1="132" x2="45" y2="132" stroke="#578c5a" stroke-width="1.5"/>
  <line x1="30" y1="139" x2="45" y2="139" stroke="#578c5a" stroke-width="1.5"/>

  <!-- Sensory waves -->
  <path d="M165 50 Q175 55 165 60" fill="none" stroke="#3d6940" stroke-width="1.5" opacity="0.6"/>
  <path d="M172 48 Q185 55 172 62" fill="none" stroke="#3d6940" stroke-width="1.5" opacity="0.4"/>
</svg>
