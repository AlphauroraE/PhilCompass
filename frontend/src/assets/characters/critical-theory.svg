<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Critical Theory - The Social Transformer: figure breaking chains -->
  <defs>
    <linearGradient id="critGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#578c5a"/>
      <stop offset="100%" style="stop-color:#3d6940"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#critGrad)" opacity="0.2"/>

  <!-- Figure head -->
  <ellipse cx="100" cy="55" rx="25" ry="28" fill="#578c5a"/>

  <!-- Body in action pose -->
  <path d="M65 85 Q100 75 135 85 L130 145 Q100 155 70 145 Z" fill="#578c5a"/>

  <!-- Arms raised breaking chains -->
  <path d="M70 95 L45 65 L50 60 L75 88" fill="#3d6940"/>
  <path d="M130 95 L155 65 L150 60 L125 88" fill="#3d6940"/>

  <!-- Breaking chain links -->
  <ellipse cx="40" cy="55" rx="8" ry="5" fill="none" stroke="#3d6940" stroke-width="3"/>
  <ellipse cx="55" cy="50" rx="8" ry="5" fill="none" stroke="#3d6940" stroke-width="3" transform="rotate(20 55 50)"/>

  <ellipse cx="160" cy="55" rx="8" ry="5" fill="none" stroke="#3d6940" stroke-width="3"/>
  <ellipse cx="145" cy="50" rx="8" ry="5" fill="none" stroke="#3d6940" stroke-width="3" transform="rotate(-20 145 50)"/>

  <!-- Breaking effect lines -->
  <g stroke="#578c5a" stroke-width="2">
    <line x1="48" y1="45" x2="52" y2="38"/>
    <line x1="55" y1="42" x2="60" y2="35"/>
    <line x1="152" y1="45" x2="148" y2="38"/>
    <line x1="145" y1="42" x2="140" y2="35"/>
  </g>

  <!-- Rising/transformation symbol -->
  <path d="M85 165 L100 150 L115 165" fill="none" stroke="#3d6940" stroke-width="3"/>
  <path d="M90 175 L100 160 L110 175" fill="none" stroke="#3d6940" stroke-width="2"/>
</svg>
